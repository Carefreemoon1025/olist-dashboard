[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-analysis-copilot"
version = "0.1.0"
description = "可复现的 Olist 电商经营分析与 AI 辅助决策平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "duckdb>=1.1",
  "plotly>=5.24",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "streamlit>=1.40",
  "openpyxl>=3.1",
  "pyarrow>=17.0",
  "openai>=1.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
